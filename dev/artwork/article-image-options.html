<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article Image Options</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, sans-serif; background: #050505; color: #f5f3ec; }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 32px; background: #050505; }
      header { display: flex; justify-content: space-between; gap: 24px; align-items: baseline; margin-bottom: 48px; }
      h1 { margin: 0; font-size: clamp(32px, 5vw, 72px); font-weight: 500; letter-spacing: -0.04em; }
      header p, figcaption { color: #9c9c9c; font: 12px/1.4 monospace; text-transform: uppercase; letter-spacing: .04em; }
      section { margin-bottom: 56px; }
      h2 { margin: 0 0 16px; font-size: 22px; font-weight: 500; }
      .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      figure { margin: 0; }
      img { display: block; width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: #111; }
      figcaption { padding-top: 10px; }
      @media (max-width: 760px) { body { padding: 16px; } header { display: block; } .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <header><h1>Article image options</h1><p>11 articles · 3 options each</p></header>
    <main id="gallery"></main>
    <script>
      const articles = [
        ["Company of One", "company-of-one"],
        ["A Free Surf Lesson", "a-free-surf-lesson"],
        ["Showing My Teeth", "showing-my-teeth"],
        ["Intention Deficit Disorder", "intention-deficit-disorder"],
        ["Two-Dollar Bill", "two-dollar-bill"],
        ["You Always Let Yourself Win", "you-always-let-yourself-win"],
        ["Cut, Defer or Build", "cut-defer-or-build"],
        ["Product Design Principles", "design-principles-that-actually-shape-the-product"],
        ["Embedded Product Design Lessons", "lessons-from-fifteen-years-of-embedded-product-design"],
        ["The Constraint Was the Brief", "the-constraint-was-the-brief"],
        ["What Makes a Real MVP?", "what-makes-a-real-mvp"],
      ];
      const gallery = document.querySelector("#gallery");
      for (const [title, slug] of articles) {
        const section = document.createElement("section");
        section.innerHTML = `<h2>${title}</h2><div class="grid">${[1, 2, 3].map(option => `<figure><img src="/assets/source/projects/article-options/${slug}/option-${option}.png" alt="${title}, option ${option}"><figcaption>Option ${option}</figcaption></figure>`).join("")}</div>`;
        gallery.append(section);
      }
    </script>
  </body>
</html>
