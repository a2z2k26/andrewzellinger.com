<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Glass Lens Lab</title>
    <script type="module" src="/src/effects/dom-glass-lab.js"></script>
  </head>
  <body>
    <main class="glass-lab-scene">
      <header class="glass-lab-header">
        <span>Andrew Zellinger</span>
        <span>DOM Liquid Glass Study</span>
      </header>

      <section class="glass-lab-stage" aria-label="Liquid glass effect test">
        <div class="glass-lab-grid" aria-hidden="true"></div>
        <div class="glass-lab-marquee" aria-hidden="true">
          <span>DESIGN / STRATEGY / CODE / AGENTIC SYSTEMS / </span>
          <span>DESIGN / STRATEGY / CODE / AGENTIC SYSTEMS / </span>
        </div>
        <div class="glass-lab-copy">
          <p>THE LENS SAMPLES</p>
          <p>THE LIVE DOM</p>
        </div>
        <div class="glass-lab-colour glass-lab-colour--cyan"></div>
        <div class="glass-lab-colour glass-lab-colour--magenta"></div>
        <div class="glass-lab-hairline"></div>
      </section>

      <p class="glass-lab-note">Move the page behind the fixed lens. Tune refraction and chromatic separation in the panel.</p>
    </main>

    <div class="dom-glass-lens-lab dom-glass-lens-effect" data-dom-glass-lens aria-hidden="true"></div>
  </body>
</html>
